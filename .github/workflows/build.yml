# This is the workflow that publishes the KinRin image.
#
# Workflow-level, not job-level:
#   env:  — all three jobs expand ${{ env.OWNER }} / ${{ env.REPO }}, and the build
#           job's publish step expands $OWNER too. A job-scoped env would leave
#           it empty there. Both podman and skopeo reject an uppercase owner and
#           a GitHub login may carry one, so everything lowercases with ${OWNER,,}.
#   if:   — deliberately NOT here. A bare workflow-level `if:` is a schema error.
#           The default-branch gate sits at JOB level on `build` and `publish`.
#
# The two job-level gates matter: without them a `workflow_dispatch` from a
# feature branch produces a tag the steps below never name, and the jobs fail
# with "image not known".
name: build

on:
  push:
    # Only a change that can alter the IMAGE rebuilds it. Without this filter a
    # typo fix in README.md spends a full container build, republishes `:latest`,
    # and mints a release whose digest differs from the last one for no change to
    # the artefact — three publications of the same operating system wearing
    # different digests, which is exactly the ambiguity the digest exists to
    # remove.
    #
    # These four paths are the whole build input, checked against the tree rather
    # than guessed: the recipe and its eight modules, the 13 staged files, the
    # public key the `signing` module signs with, and this workflow.
    #
    # IF YOU ADD A BUILD INPUT OUTSIDE THESE PATHS, ADD IT HERE. A path filter is
    # silent: a recipe that reads a file nobody listed stops rebuilding on change
    # and the failure looks like "CI is flaky", not like a missing path.
    paths:
      - 'recipes/**'
      - 'files/**'
      - 'cosign.pub'
      - '.github/workflows/build.yml'
  # Deliberately NOT path-filtered. The schedule exists to notice that the
  # unpinned `:latest` base moved under us, which by definition involves no
  # commit at all — filtering this trigger would defeat its only purpose.
  schedule:
    # Monthly. The base follows `:latest` and is never pinned, so a monthly run
    # is the only thing that detects upstream drift.
    - cron: '17 5 1 * *'
  workflow_dispatch:

env:
  OWNER: ${{ github.repository_owner }}
  REPO: ${{ github.repository }}
  # Where `--archive` writes the OCI archive that the load step consumes.
  # A literal path, because `runner`/`env` contexts are not available in a
  # workflow-level env block (actionlint rejects them); RUNNER_TEMP is exported
  # into every step shell on a GitHub runner, so the steps use that instead.
  ARCHIVE_DIR: /tmp/kinrin-archive

jobs:
  # Job 1 — pre-build validate, on every push as well as the schedule. This is
  # the gate that keeps a bad recipe out of a 20-minute bootc build.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A GitHub runner has no bluebuild. Installed from upstream's own
      # installer image, pinned by DIGEST rather than by tag so a re-pushed
      # `:latest`-style tag cannot change what builds this image, then asserted
      # by version string. This is the same 0.9.37 the recipe was written against
      # (NOTES.md §1.2).
      - name: Install bluebuild
        run: |
          set -euo pipefail
          REF="ghcr.io/blue-build/cli@sha256:281d3152c1a4e30e75e777f78b07a8c5c1e5130cb44092f4b4b507402556ec0a"
          sudo mkdir -p /opt/bb
          podman create --name bb-install "$REF"
          podman cp bb-install:/out/bluebuild /opt/bb/bluebuild
          podman rm bb-install
          sudo install -m 0755 /opt/bb/bluebuild /usr/local/bin/bluebuild
          rm -rf /opt/bb
          bluebuild --version
          bluebuild --version | grep -q 'BlueBuild 0.9.37'

      # Facts, not a guess, and they cost seconds because this job finishes in
      # under a minute — unlike the build job, where discovering them means
      # paying for a twenty-minute build first. bluebuild takes a
      # podman-in-podman path when the host podman is older than 5.0
      # (process/drivers/podman_driver.rs:588), and when it does, the image lands
      # in a storage the job's own `podman` does not read — which is what makes
      # every in-image gate fail with the image plainly reported as built.
      - name: Report the podman environment
        run: |
          echo "uid: $(id -u)"
          echo "which podman: $(command -v podman || echo none)"
          podman --version 2>&1 || true
          echo "GraphRoot: $(podman info --format '{{.Store.GraphRoot}}' 2>&1 || true)"
          echo "RunRoot:   $(podman info --format '{{.Store.RunRoot}}' 2>&1 || true)"
          echo "--- podman images ---"; podman images 2>&1 || true
          echo "--- sudo podman images ---"; sudo -n podman images 2>&1 || true

      - name: Validate the recipe
        run: bluebuild validate recipes/recipe.yaml
      - name: Generate the Containerfile
        # `generate` needs the flags as much as `build` does: the `signing` module
        # keys its policy from what `generate` passes, so left unset the two
        # would name the image differently.
        run: |
          bluebuild generate recipes/recipe.yaml -o /tmp/Containerfile \
            --registry ghcr.io --registry-namespace "${OWNER,,}"

  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      fedora: ${{ steps.versions.outputs.fedora }}
      dms: ${{ steps.versions.outputs.dms }}
    steps:
      - uses: actions/checkout@v4

      # bootc images grow fast; free runner disk before spending 20 minutes on it.
      - name: Free disk space
        run: rm -rf /opt/hostedtoolcache

      - name: Install bluebuild
        run: |
          set -euo pipefail
          REF="ghcr.io/blue-build/cli@sha256:281d3152c1a4e30e75e777f78b07a8c5c1e5130cb44092f4b4b507402556ec0a"
          sudo mkdir -p /opt/bb
          podman create --name bb-install "$REF"
          podman cp bb-install:/out/bluebuild /opt/bb/bluebuild
          podman rm bb-install
          sudo install -m 0755 /opt/bb/bluebuild /usr/local/bin/bluebuild
          rm -rf /opt/bb
          bluebuild --version | grep -q 'BlueBuild 0.9.37'

      - name: Build the image
        # The flags, not a hand-written tag: `bluebuild` names the image from
        # the recipe `name:` plus `--registry`/`--registry-namespace`, and
        # lowercases all three. The `signing` module keys its in-image policy
        # from exactly that value, so the policy and the pushed reference agree
        # (criterion 28b).
        run: |
          bluebuild -vv build \
            --build-driver docker \
            --archive "${ARCHIVE_DIR}" \
            --registry ghcr.io --registry-namespace "${OWNER,,}" \
            --skip-validation recipes/recipe.yaml

      # Make the freshly built image addressable under the ref the gates and the
      # handover use. bluebuild reports `ghcr.io/<owner>/<repo>:latest` as built,
      # but what it puts there is a MANIFEST LIST; the runnable platform image is
      # the separate `:latest_<arch>` ref. A manifest-list ref is not directly
      # runnable, and without --pull podman resolves it through the REGISTRY —
      # which serves the PREVIOUS published image, so the gates would go green on
      # the last good build while this one is broken. That is the exact false
      # green the plan spends most of its length ruling out, so the ref is
      # resolved here, once, explicitly.
      #
      # Fail-closed: if no platform instance is found, this step dies rather than
      # leaving the gates to run against something unexpected.
      # bluebuild's docker driver deliberately does NOT put the image in the
      # local image store on a GitHub runner: docker_driver.rs only passes
      # `--load` when GITHUB_ACTIONS is *unset*, because upstream expects the
      # result to be pushed. Without `--push` the image lives only in the buildx
      # builder's content store, where neither `podman images` nor
      # `docker images` can see it -- which is why bluebuild could log
      # "Finished building" with all five tags while every gate found nothing.
      #
      # The supported way to get the image back out without pushing is
      # `--archive`, which switches the driver to `--output type=oci,dest=FILE`.
      # The result is an OCI archive on disk rather than something in a daemon
      # nobody reads. It is loaded into podman here, once, so the gates again run
      # against a real local image -- the storage-sharing property the plan's
      # `--pull=never` gates assume.
      - name: Load the built image into podman
        run: |
          set -euo pipefail
          echo "::group::archive directory"
          mkdir -p "$ARCHIVE_DIR"
          ls -la "$ARCHIVE_DIR"
          echo "::endgroup::"
          # The suffix is bluebuild's ARCHIVE_SUFFIX, observed on the runner as
          # `kinrin-distro.tar.gz`; a glob of `*.tar` misses it, which is what
          # one cycle found.
          ARCHIVE=$(find "$ARCHIVE_DIR" -maxdepth 1 -type f -name '*.tar.gz' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::bluebuild produced no .tar.gz under $ARCHIVE_DIR"
            exit 1
          fi
          echo "loading $ARCHIVE"
          # podman load prints the ref it loaded. That is the only place the
          # name is available: the archive output path applies no -t tag.
          podman load -i "$ARCHIVE" | tee /tmp/podman-load.out
          LOADED=$(sed -n 's/^Loaded image.*: //p' /tmp/podman-load.out | head -1)
          if [ -z "$LOADED" ]; then
            echo "::error::could not read a loaded image name from podman load"
            cat /tmp/podman-load.out
            exit 1
          fi
          echo "loaded as $LOADED"
          podman tag "$LOADED" "ghcr.io/${REPO,,}:latest"

      - name: Resolve the built image to a runnable ref
        # bluebuild reports `ghcr.io/<owner>/<repo>:latest` as built, yet that ref
        # is not always directly runnable: what lands on it can be a manifest
        # list, with the platform image as a separate `:latest_<arch>` ref. A
        # manifest-list ref cannot be run directly, and without --pull podman
        # resolves it through the REGISTRY — which serves the PREVIOUS published
        # image, so every gate would go green on the last good build while this
        # one is broken. That is the exact false green the plan spends most of
        # its length ruling out.
        #
        # So the tag layout is not assumed: every ref bluebuild left under this
        # repository is PROBED for runnability and the first that actually runs
        # wins. A naming convention that guessed wrong would fail here; a probe
        # cannot.
        #
        # No `set -e` on this step, and every grep ends in `|| true`: a grep that
        # matches nothing exits 1, which under `set -e` kills the step before it
        # can print what it found. That is the same fail-closed-looking,
        # fail-silent shape PLAN §3.2 warns about for `flatpak remotes | grep`.
        run: |
          set -uo pipefail
          # The image repository IS ghcr.io/<owner>/<repo>. Do not append a
          # second name: this step once searched for ghcr.io/<owner>/<repo>/kinrin,
          # a leftover of the old recipe name, and reported "no image after the
          # build" while the build had plainly succeeded. `${REPO,,}` is the whole
          # reference, and the recipe `name:` is already inside it.
          REPO_REF="ghcr.io/${REPO,,}"
          REF="${REPO_REF}:latest"
          PREFIX="${REPO_REF}:"

          echo "::group::what podman holds"
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' || true
          echo "::endgroup::"

          CANDS=$(podman images --format '{{.Repository}}:{{.Tag}}' \
                    | grep -F "$PREFIX" || true)
          if [ -z "$CANDS" ]; then
            echo "::error::no image under $PREFIX after the build"
            exit 1
          fi

          RUNNABLE=""
          for cand in $CANDS; do
            if podman run --rm --pull=never "$cand" true >/dev/null 2>&1; then
              RUNNABLE="$cand"
              break
            fi
            echo "not runnable: $cand"
          done

          if [ -z "$RUNNABLE" ]; then
            echo "::error::no ref under $PREFIX is runnable without pulling"
            exit 1
          fi
          echo "runnable ref: $RUNNABLE"

          if [ "$RUNNABLE" != "$REF" ]; then
            podman tag "$RUNNABLE" "$REF"
            echo "tagged $RUNNABLE -> $REF"
          fi
          # Fail closed: prove the canonical ref the gates and the save use really
          # runs, rather than discovering it three steps later.
          podman run --rm --pull=never "$REF" true \
            || { echo "::error::$REF still is not runnable"; exit 1; }

      # Gate 1 of 4 on the image (criterion 28). `niri validate` is not runnable
      # bare: the binary is absent from a GitHub runner, and a host-side call
      # would not see the image's config anyway.
      #
      # --pull=never on EVERY gate below, and it is not about the network.
      # bluebuild leaves a manifest list on `ghcr.io/<owner>/<repo>:latest` plus
      # the platform instance as `:latest_<arch>`, and a bare `podman run` on the
      # manifest-list tag goes to the REGISTRY to resolve it. On the first run
      # that is a 403 — the package does not exist yet. On every later run it
      # is worse than an error: podman resolves the manifest against the registry
      # and runs the PREVIOUSLY PUBLISHED image, so the gates would go green on
      # the last good build while the fresh one is broken. A gate must test what
      # was just built, and only what was just built.
      - name: niri validate inside the image
        run: |
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" \
            niri validate --config /etc/niri/config.kdl

      # Gate 2 of 4 (criterion 28). The only check that can see a `files`
      # destination go missing: a `{source:}` entry with no `{destination:}`
      # leaves DEST the literal string `null`, `cp -f` succeeds, and the module
      # exits 0. Thirteen paths, one && chain, the §5.2 list in order.
      - name: files.yaml presence chain
        run: |
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" sh -c 'test -f /etc/xdg/xdg-desktop-portal/portals.conf && test -f /etc/greetd/config.toml && test -f /etc/systemd/logind.conf.d/kinrin.conf && test -f /usr/lib/systemd/user/niri.service.d/kinrin-dms.conf && test -f /usr/lib/systemd/user/niri.service.d/kinrin-xdg.conf && test -f /usr/lib/systemd/user/niri.service.d/kinrin-theme.conf && test -f /usr/lib/systemd/user/dms.service.d/kinrin-theme.conf && test -f /usr/lib/systemd/user/niri.service.d/kinrin-vrr.conf && test -f /usr/lib/systemd/user/niri-vrr.service && test -f /etc/environment.d/90-dms.conf && test -f /usr/share/dms/cli-policy.json && test -f /etc/skel/.config/niri/local.kdl && test -f /etc/skel/.config/DankMaterialShell/settings.json && test -f /usr/lib/sysctl.d/70-kinrin-gaming.conf && test -f /etc/skel/.tmux.conf && test -f /etc/skel/.config/tmux/dracula.tmux && test -f /etc/skel/.config/tmux/scripts/dracula.sh && test -f /etc/skel/.config/tmux/scripts/utils.sh && test -f /etc/skel/.config/konsolerc && test -f /etc/skel/.local/share/konsole/Dracula.colorscheme && test -f /etc/skel/.local/share/konsole/Dracula.profile && test -f /etc/skel/.local/share/color-schemes/Dracula.colors && test -f /etc/skel/.config/opencode/tui.json && test -f /etc/skel/.config/opencode/themes/dracula.json && test -f /etc/skel/.config/Kvantum/Dracula/Dracula.kvconfig && test -f /etc/skel/.config/Kvantum/Dracula/Dracula.svg && test -f /etc/skel/.config/Kvantum/kvantum.kvconfig && test -f /etc/skel/.config/qt6ct/qt6ct.conf && test -f /etc/skel/.config/qt6ct/colors/Dracula.conf && test -f /etc/skel/.config/environment.d/91-qt-theme.conf'

      # Gate 3 of 4 (criterion 28b) + the two greps the prompt adds (§5). Read the
      # signing policy out of the image rather than asserting it: an absent policy
      # is an absence, not a default. The 2>&1 matters — without it a missing file
      # goes to stderr and the jq below cannot fail on it.
      - name: Read the signing policy out of the built image
        run: |
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" sh -c 'ls -l /etc/containers/policy.json /etc/containers/registries.d/ 2>&1'
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" sh -c 'test -f /etc/containers/policy.json || exit 1'
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" \
            jq -r '.transports.docker | keys[]' /etc/containers/policy.json
          # ASSERT, do not merely print. The policy key is the recipe `name:`
          # joined to the build registry, while the push target is
          # ghcr.io/${{ github.repository }} — if those two ever differ, the
          # image ships a verification policy covering a reference nothing
          # publishes, and boot-time verification of the published image resolves
          # nothing. Printing the key would have passed on a mismatch; this fails.
          # `jq` is passed as argv, NOT via `sh -c`. Single quotes would have
          # kept `${REPO,,}` from ever being expanded: it reaches the container's
          # `sh`, which has no `${var,,}`, so `$r` arrived as `ghcr.io/` and this
          # gate failed on an image whose policy was in fact correct. One cycle
          # was spent failing against a good image.
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" \
            jq -e --arg r "ghcr.io/${REPO,,}" \
            '.transports.docker | has($r)' /etc/containers/policy.json

      - name: os-release carries ID=kinrin and ID_LIKE=fedora
        run: |
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" \
            grep -qE '^ID="?kinrin"?$' /etc/os-release
          podman run --rm --pull=never "ghcr.io/${REPO,,}:latest" \
            grep -qE '^ID_LIKE="?fedora"?$' /etc/os-release

      # Hand the image to the publish job. Each job gets a FRESH runner, so
      # nothing travels with `needs: build` by itself.
      #
      # The OCI archive bluebuild already wrote is handed over as-is, rather than
      # re-exported with `podman save | zstd`. It is the same image, already
      # compressed, and it removes two steps that both exist only to move bytes
      # between a podman store the next job cannot see and skopeo -- a path that
      # failed anyway: `skopeo copy --all containers-storage:` drives podman over
      # `dial-stdio` and died with `Error during unshare(...): Operation not
      # permitted`, even though `podman load` on the same runner had just
      # succeeded. Reading the archive needs no podman at all.
      # The release version is DERIVED FROM THE IMAGE, never hardcoded: a
      # hardcoded version drifts the moment the base moves, and a release whose
      # name disagrees with its contents is worse than no release.
      #
      # Read from the image that was actually built and gated, while it is
      # loaded in podman — not by pulling from the registry, which would cost a
      # multi-gigabyte download to learn two version numbers.
      #
      # `dms`, not `dank-material-shell`: the RPM is named `dms`. Asking for the
      # long name returns "not installed", which would silently yield an empty
      # minor version.
      - name: Derive the release version from the built image
        id: versions
        run: |
          set -euo pipefail
          REF="ghcr.io/${REPO,,}:latest"
          FEDORA=$(podman run --rm --pull=never "$REF" \
            sed -n 's/^Fedora release \([0-9]\{1,\}\).*/\1/p' /etc/fedora-release)
          DMS=$(podman run --rm --pull=never "$REF" rpm -q dms --qf '%{VERSION}\n')
          # Fail closed. An empty value would compose into a plausible-looking
          # but wrong version such as `v.1.0`, and that release would exist
          # forever under a name that means nothing.
          if [ -z "$FEDORA" ] || [ -z "$DMS" ]; then
            echo "::error::could not derive versions from the image (fedora='$FEDORA' dms='$DMS')"
            exit 1
          fi
          echo "fedora=$FEDORA" >> "$GITHUB_OUTPUT"
          echo "dms=$DMS" >> "$GITHUB_OUTPUT"
          echo "Fedora $FEDORA, dms $DMS -> version v${FEDORA}.${DMS%%.*}.x"

      - name: Hand over the OCI archive
        run: |
          set -euo pipefail
          ARCHIVE=$(find "$ARCHIVE_DIR" -maxdepth 1 -type f -name '*.tar.gz' | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::no OCI archive under $ARCHIVE_DIR to hand over"
            exit 1
          fi
          cp "$ARCHIVE" kinrin-oci.tar.gz
          ls -l kinrin-oci.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kinrin-image
          path: kinrin-oci.tar.gz

      - name: Publish the cosign public key as an artifact
        # The public half must travel with the release: it is what `cosign
        # verify` checks and what the target machine needs at boot. `--key` reads
        # a file, not a variable.
        uses: actions/upload-artifact@v4
        with:
          name: kinrin-cosign-pub
          path: cosign.pub

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      # The GHCR push needs packages: write; the checkout needs contents: read.
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kinrin-image

      # cosign is not on a GitHub runner either. Pinned to a released version and
      # checked against the checksum upstream publishes beside it, so the binary
      # that signs is the binary upstream shipped — without needing cosign to
      # verify cosign.
      - name: Install cosign
        run: |
          set -euo pipefail
          VERSION=v3.1.3
          BASE=https://github.com/sigstore/cosign/releases/download/${VERSION}
          # Downloaded under its ORIGINAL name on purpose: `sha256sum --check`
          # verifies a file whose name comes from the checksum line, so saving it
          # as `cosign` made the check fail with "No such file or directory"
          # against a checksum that was perfectly correct.
          curl -fsSL -o cosign-linux-amd64 "${BASE}/cosign-linux-amd64"
          curl -fsSL -o checksums.txt "${BASE}/cosign_checksums.txt"
          grep 'cosign-linux-amd64$' checksums.txt | sha256sum --check --status
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          rm -f cosign-linux-amd64 checksums.txt
          cosign version | head -1

      - name: Log in to GHCR
        run: skopeo login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Meta
        id: meta
        # Computed HERE, in the publish job, and never hardcoded: the base is not
        # pinned, so a frozen tag would name a build that no longer happens.
        run: echo "tag=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Publish
        # The source is `oci-archive:`, NOT `docker://` — the latter is a
        # *registry* reference and fails with `connection refused` on a runner.
        # Two copies because one copy pushes one tag.
        run: |
          skopeo copy --all "oci-archive:kinrin-oci.tar.gz" "docker://ghcr.io/${REPO,,}:latest"
          skopeo copy --all "oci-archive:kinrin-oci.tar.gz" "docker://ghcr.io/${REPO,,}:${{ steps.meta.outputs.tag }}"

      # AFTER the push, and read back from the registry: `skopeo copy` rewrites
      # the layers, so the local manifest digest is not the one the registry
      # serves, and signing that one fails with `manifest unknown`.
      # --preserve-digests is not an escape; it errors with
      # "Copying this image would require changing layer representation".
      - name: Capture digest
        id: digest
        run: echo "digest=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/${REPO,,}:latest")" >> "$GITHUB_OUTPUT"

      # A command substitution that fails does NOT fail its step: `echo
      # "digest=$(false)"` exits 0 and writes `digest=`. Never sign an empty or
      # unresolvable reference.
      - name: Assert the digest is non-empty
        run: test -n "${{ steps.digest.outputs.digest }}"

      # cosign does not read the auth file `skopeo login` writes. skopeo uses
      # containers-image's `$XDG_RUNTIME_DIR/containers/auth.json`; cosign looks
      # in `$DOCKER_CONFIG/config.json`. Without this the sign step got as far as
      # `Pushing signature to:` and then failed with `UNAUTHORIZED:
      # unauthenticated: User cannot be authenticated with the token provided` --
      # on a push that had just succeeded with skopeo's own credentials, for the
      # same registry, in the same job.
      - name: Log in to GHCR for cosign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign
        env:
          # In the step `env:` block, NOT as an inline shell prefix: a generated
          # cosign key is a MULTILINE PEM, and an unquoted `VAR=${{ … }} command`
          # prefix splits at the first newline inside it.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          # Add COSIGN_PASSWORD here ONLY if the key is passphrase-protected, or
          # the run blocks on a prompt that never comes.
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "ghcr.io/${REPO,,}@${{ steps.digest.outputs.digest }}"

      # Gate 4: verify the pushed digest, never a tag — no tag designates a
      # stable image across builds. This one can only run once job 3 has pushed.
      - name: Verify the signature against the pushed digest
        run: cosign verify --key cosign.pub "ghcr.io/${REPO,,}@${{ steps.digest.outputs.digest }}"

  # A Release here is a human-readable index entry for an image that lives in
  # GHCR, NOT a place to host the image: GitHub caps a release asset at 2 GiB and
  # the OCI archive is 4.2. So the release carries the digest, the pinned pull
  # and verify commands, and cosign.pub — everything needed to fetch and check it,
  # with the image itself staying in the registry where it is actually immutable.
  release:
    # `iso` is a hard dependency on purpose. A release whose ISO silently failed
    # to build is a release that looks complete and is not; failing closed here
    # keeps "the Release has a bootable ISO" a true statement every time.
    needs: [build, publish, iso]
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      # Only what a Release needs. Deliberately NOT `packages: write`: this job
      # must not be able to move a tag in the registry.
      contents: write
    # Two runs must never pick the same version: both would read the same release
    # list, compute the same patch, and race to create one tag. Serialising by
    # workflow+ref means the second run queues and then recomputes from the
    # release the first one just created.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The ISO travels from the job that built it as an artifact, so the release
      # never has to regenerate it.
      - uses: actions/download-artifact@v4
        with:
          name: kinrin-iso
          path: iso-asset

      - name: Compute the version
        id: ver
        env:
          FEDORA: ${{ needs.build.outputs.fedora }}
          DMS: ${{ needs.build.outputs.dms }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$FEDORA" ] || [ -z "$DMS" ] || [ -z "$DIGEST" ]; then
            echo "::error::missing inputs (fedora='$FEDORA' dms='$DMS' digest='$DIGEST')"
            exit 1
          fi

          # Idempotency. A re-run of the same commit rebuilds to the SAME digest,
          # and without this guard it would mint v44.1.1, v44.1.2 and so on for
          # one unchanged image. Releases, not CI runs, are what get numbered.
          if gh release list --limit 200 --json body | jq -r '.[].body' | grep -qF "$DIGEST"; then
            EXISTING=$(gh release list --limit 200 --json tagName,body \
              | jq -r --arg d "$DIGEST" \
                  '.[] | select(.body | contains($d)) | .tagName' | head -1)
            echo "::notice::digest $DIGEST is already released as $EXISTING — nothing to do"
            echo "version=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR="$FEDORA"
          MINOR="${DMS%%.*}"
          PREFIX="v${MAJOR}.${MINOR}."
          # Highest existing patch for THIS major.minor, or -1 when none exists so
          # the first release of a new minor is .0 rather than .1. `tonumber`, not
          # string max: v44.1.10 must sort above v44.1.9. Non-numeric suffixes are
          # filtered out rather than crashing the comparison.
          # `gh --jq` is NOT jq and rejects `--arg`; the JSON is piped to a real
          # jq, which is what accepts --arg. Both spellings look right and only
          # one runs.
          HIGHEST=$(gh release list --limit 200 --json tagName \
            | jq -r --arg p "$PREFIX" '
                [ .[].tagName | select(startswith($p)) | ltrimstr($p)
                  | select(test("^[0-9]+$")) | tonumber ]
                | if length == 0 then -1 else max end')
          VERSION="${PREFIX}$((HIGHEST + 1))"

          echo "Fedora $MAJOR, dms $MINOR, previous patch $HIGHEST -> $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.ver.outputs.fresh == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          FEDORA: ${{ needs.build.outputs.fedora }}
          DMS: ${{ needs.build.outputs.dms }}
          ATTACHABLE: ${{ needs.iso.outputs.attachable }}
          ISO_GIB: ${{ needs.iso.outputs.gib }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPO,,}"

          # Written to a file, not `--notes`: the notes contain backticks and a
          # shell snippet, and passing them inline invites the shell to interpret
          # them. The file is the safe form.
          cat > notes.md <<EOF
          Fedora $FEDORA · dms $DMS

          ## Image

          The image lives in GHCR, not in this release: GitHub caps a release asset
          at 2 GiB and this image's OCI archive is 4.2. The registry is also the
          only place where it is addressed by content rather than by name.

          \`\`\`sh
          podman pull $IMAGE@$DIGEST
          \`\`\`

          ## Verify

          \`\`\`sh
          cosign verify --key cosign.pub "$IMAGE@$DIGEST"
          \`\`\`

          \`cosign.pub\` is attached to this release and is committed at the repository
          root. The signature is over the digest above, never over a tag: no tag
          designates a stable image across builds.

          ## Version scheme

          \`MAJOR.MINOR.PATCH\` — MAJOR is the Fedora release, MINOR the major version
          of dms, PATCH counts publications within that pair. The first three are
          read out of the built image, so they cannot drift from its contents.

          ## Bootable ISO

          Built from this exact image, not from a second build. GitHub caps a
          release asset at 2 GiB and the ISO is larger, so it ships as an
          artifact of this run instead of an attached file:

          \`\`\`sh
          gh run download ${GITHUB_RUN_ID} --repo ${REPO,,} -n kinrin-iso -D .
          \`\`\`

          Or open the run artifacts page directly:
          https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # Assets are passed as trailing arguments. The ISO is added only when it
          # fits GitHub's 2 GiB release-asset cap: passing an oversized file makes
          # `gh release create` fail AFTER the release exists, which leaves a
          # release published with no ISO and no error to explain it.
          assets=(cosign.pub)
          if [ "$ATTACHABLE" = "true" ]; then
            iso=$(find iso-asset -type f -name '*.iso' | head -1)
            if [ -n "$iso" ]; then
              echo "attaching ISO: $iso"
              assets+=("$iso")
            else
              echo "::error::attachable was true but no .iso was downloaded"
              exit 1
            fi
          else
            echo "::warning::ISO is $ISO_GIB GiB, over the 2 GiB cap; shipping as a workflow artifact instead"
          fi

          # The tag is pinned to the commit that produced it, not to the branch
          # head, so a release always names the tree it was built from.
          gh release create "$VERSION" \
            --title "KinRin $VERSION (Fedora $FEDORA, dms $DMS)" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            "${assets[@]}"

          echo "created $VERSION -> $DIGEST"

      - name: Confirm the release resolves
        if: steps.ver.outputs.fresh == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Do not trust the create step's exit status alone: confirm the release
          # is actually fetchable, which is the thing a reader will rely on.
          gh release view "$VERSION" --json tagName,isDraft,url --jq '"\(.tagName) draft=\(.isDraft) \(.url)"'
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = "false"

  # A bootable ISO, generated from the PUBLISHED image rather than from a second
  # build. Building it from the recipe instead would compile everything twice and
  # could legitimately produce a different artefact than the one that was gated and
  # signed — an ISO nobody verified.
  #
  # `-V kinoite` asks for a user and password at install time, which is the stable
  # variant and the right one for a desktop. The Silverblue variant defers that to
  # first boot instead.
  iso:
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      attachable: ${{ steps.gen.outputs.attachable }}
      gib: ${{ steps.gen.outputs.gib }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bluebuild
        run: |
          set -euo pipefail
          # Byte-for-byte the same pinned install the build job uses. This step
          # first resolved the tag with `skopeo inspect` and then copied from
          # `/out/bluebuild`, which does not exist there; the working step pins the
          # digest directly. One installer recipe for the whole workflow.
          REF="ghcr.io/blue-build/cli@sha256:281d3152c1a4e30e75e777f78b07a8c5c1e5130cb44092f4b4b507402556ec0a"
          sudo mkdir -p /opt/bb
          podman create --name bb-install "$REF"
          podman cp bb-install:/out/bluebuild /opt/bb/bluebuild
          podman rm bb-install
          sudo install -m 0755 /opt/bb/bluebuild /usr/local/bin/bluebuild
          rm -rf /opt/bb
          bluebuild --version | grep -q 'BlueBuild 0.9.37'

      - name: Generate the ISO from the published image
        id: gen
        run: |
          set -euo pipefail
          mkdir -p iso
          # `image` is a SUBCOMMAND and belongs after the options. Without it clap
          # reads the image ref as an unknown subcommand and exits 2.
          #
          # --secure-boot-url defaults to Universal Blue's key, which is WRONG for
          # this image: an ISO that enrolls a key it does not own cannot chain to
          # this image's shim, and on a Secure Boot machine it simply refuses to
          # boot -- which reads as "broken image" rather than "wrong key".
          #
          # This is Fedora's own Secure Boot CA, verified before being written here:
          #   subject  = C=US, ST=Massachusetts, L=Cambridge, O=Red Hat, Inc.,
          #              OU=Fedora Secure Boot CA 20200709, CN=fedoraca
          #   notAfter = Jan 19 2037
          #   sha1     = 2B:B0:10:E2:4D:94:C6:32:24:58:89:BA:AA:9E:D0:F3:D5:EF:1F:68
          # The URL is pinned to a commit (the /raw/f40/f/ component), so it cannot
          # drift under us the way a branch or tag reference would.
          #
          # --enrollment-password defaults to the literal string "universalblue".
          # A user hitting the MOK prompt would be told to type a competitor's name
          # to install this image, and would install nothing if they typed ours.
          # It is not a secret -- it is a shared passphrase the installer asks the
          # user to type once, on their own machine, and it is documented in the
          # README.
          bluebuild -vv generate-iso \
            --output-dir iso \
            --variant kinoite \
            --secure-boot-url https://src.fedoraproject.org/rpms/shim-unsigned-x64/raw/f40/f/fedora-ca-20200709.cer \
            --enrollment-password kinrin \
            image "ghcr.io/${REPO,,}:latest"

          # Measured, not assumed: the whole DVD question turns on this number, and
          # an estimate that turns out 300 MB over is discovered only after writing
          # a DVD. `du --apparent-size` on the real file, in both units.
          ISO=$(find iso -type f -name '*.iso' | head -1)
          if [ -z "$ISO" ]; then
            echo "::error::generate-iso produced no .iso"
            exit 1
          fi
          stat -c '%n %s' "$ISO"
          du -h "$ISO"; du -h --apparent-size "$ISO"
          BYTES=$(stat -c '%s' "$ISO")
          GIB=$(awk -v b="$BYTES" 'BEGIN{printf "%.2f", b/1024/1024/1024}')
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "gib=$GIB" >> "$GITHUB_OUTPUT"
          # GitHub caps a release asset at 2 GiB. Say so here, where the number is
          # known, rather than letting a later `gh release upload` fail obscurely.
          if [ "$BYTES" -le 2147483648 ]; then
            echo "attachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "attachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ISO is $GIB GiB, above GitHub's 2 GiB release-asset cap; it ships as a workflow artifact only"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kinrin-iso
          path: ${{ steps.gen.outputs.iso }}

