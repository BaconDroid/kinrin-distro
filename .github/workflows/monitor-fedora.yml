# Monthly check that the two COPR package names have landed in the Fedora repos.
#
# §9. Two rules decide whether this job helps or misleads, and both are load-bearing:
#
#  1. Match the two COPR package names INDIVIDUALLY — `dms` and `dms-greeter` —
#     never a generic "DMS arrived" signal, or the job opens a migration issue
#     while one of the two is still COPR-only and the next build fails.
#     `DankMaterialShell` is ALREADY in Fedora and `danksearch` is too, so any
#     "a DMS package exists" signal reads true on day one. Landed means the COPR
#     name is GONE from the COPR, not that some DMS package exists in Fedora.
#
#  2. The issue it opens must name the right file: `recipes/modules/dnf.yaml`,
#     NOT `recipe.yaml`, which only lists modules and has no such key. Saying the
#     wrong file is worse than saying nothing — it sends the maintainer editing a
#     file with nothing to remove. And the same issue must also say to RENAME
#     `dms` to `DankMaterialShell` in that file's `install:` list: dropping the
#     COPR key without the rename leaves a `dnf` module asking for a package no
#     enabled repo provides, and the build fails.
#
# A broken COPR turns the monthly build red and leaves the published image
# healthy. The risk is not the outage, it is not seeing it — which is what this
# job is for.
name: monitor-fedora

on:
  schedule:
    # Monthly, deliberately offset from build.yml's 05:17 so the two do not
    # compete for the same runner minutes.
    - cron: '43 6 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-landed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe both COPR names and both Fedora shell names
        # Four probes, deliberately, and they are not interchangeable:
        #
        #   copr_dms          is `dms` still resolvable FROM THE COPR?  -> not landed
        #   copr_dms_greeter  is `dms-greeter` still resolvable FROM THE COPR? -> not landed
        #   fedora_dms        does official Fedora resolve `dms`?
        #   fedora_shell      does official Fedora resolve either `dms` OR `DankMaterialShell`?
        #
        # Landing means BOTH COPR names are gone from the COPR **and** the shell
        # is resolvable from official Fedora. `DankMaterialShell` is already in
        # Fedora today, so its presence alone says nothing — it is the COPR
        # probes that carry the signal, and the Fedora probes are what make a
        # "landed" verdict mean "there is something to migrate to" rather than
        # "the COPR broke". A broken or expired COPR makes both COPR probes empty,
        # and a broken COPR is the monthly BUILD's signal, not this job's — hence
        # the Fedora side has to answer too.
        id: probe
        env:
          PROBE: |
            set -uo pipefail
            dnf -y install dnf-plugins-core >/dev/null

            resolve() {
              # Non-empty means the name resolves from the enabled repos.
              # dnf5 prints nothing and exits 0 for an unknown name, so an empty
              # result means absent — never read a non-zero exit as "absent".
              dnf repoquery --qf '%{name}-%{evr}' "$1" 2>/dev/null | head -1
            }

            # --- 1. the COPR alone ---
            dnf -y copr enable avengemedia/dms >/dev/null
            dnf -y makecache >/dev/null
            copr_dms=$(resolve dms || true)
            copr_dms_greeter=$(resolve dms-greeter || true)
            dnf -y copr disable avengemedia/dms >/dev/null

            # --- 2. official Fedora alone ---
            # Assert it: a COPR left enabled above would answer these wrongly.
            if dnf repolist --enabled 2>/dev/null | grep -q 'copr'; then
              echo "::error::a COPR is still enabled; the Fedora probes would lie"
              exit 1
            fi
            dnf -y makecache >/dev/null
            fedora_dms=$(resolve dms || true)
            fedora_shell_dms=$(resolve dms || true)
            fedora_shell_named=$(resolve DankMaterialShell || true)

            if [ -n "$fedora_shell_dms" ] || [ -n "$fedora_shell_named" ]; then
              fedora_shell=yes
            else
              fedora_shell=no
            fi

            if [ -z "$copr_dms" ] && [ -z "$copr_dms_greeter" ] && [ "$fedora_shell" = yes ]; then
              landed=true
            else
              landed=false
            fi

            # Printed to STDOUT, not written to a file. A bind-mounted
            # $GITHUB_OUTPUT needs a host file the container user can append to,
            # and rootless podman in particular turns that into a permission
            # problem for no benefit — the host reads the results off stdout.
            echo "::probe::copr_dms=${copr_dms}"
            echo "::probe::copr_dms_greeter=${copr_dms_greeter}"
            echo "::probe::fedora_dms=${fedora_dms}"
            echo "::probe::fedora_shell=${fedora_shell}"
            echo "::probe::fedora_shell_name=${fedora_shell_dms:-${fedora_shell_named}}"
            echo "::probe::landed=${landed}"
        run: |
          set -euo pipefail
          out=$(docker run --rm -e PROBE="$PROBE" \
            docker.io/library/fedora:44 bash -c "$PROBE")
          echo "$out"
          # Turn the tagged lines into step outputs on the HOST side, where
          # $GITHUB_OUTPUT is actually writable.
          while IFS= read -r line; do
            printf '%s\n' "${line#::probe::}" >> "$GITHUB_OUTPUT"
          done <<< "$(printf '%s\n' "$out" | grep '^::probe::')"

      - name: Open the migration issue once both names have left the COPR
        if: steps.probe.outputs.landed == 'true'
        run: |
          set -euo pipefail
          # Idempotent: a closed issue means the work is done, so do not reopen.
          if gh issue list --state all --search 'DMS has landed in Fedora' \
               --json number --jq '.[0].number' | grep -q .; then
            echo "A migration issue already exists; not opening another."
            exit 0
          fi

          cat > /tmp/issue.md <<'EOF'
          `dms` and `dms-greeter` have both left the COPR: the monthly monitor
          can no longer resolve either name from `copr.fedorainfracloud.org/avengemedia/dms`.
          The COPR still earns its place until this is done — drop it and the
          build asks for packages no enabled repo provides.

          This is **two edits, in one change**, both in
          `recipes/modules/dnf.yaml` — *not* in `recipe.yaml`, which only lists
          modules and has no COPR key to remove:

          1. Remove the `copr:` key from the `repos:` mapping:

             ```yaml
             repos:
               nonfree: rpmfusion
             ```

             `nonfree:` and `copr:` are two keys at the same level, not list
             entries. A `- copr:` entry breaks the build.

          2. In that same file's `install: packages:` list, replace `dms` with
             `DankMaterialShell` — the name Fedora carries:

             ```diff
             -      - dms
             +      - DankMaterialShell
             ```

             Step 1 alone leaves the `dnf` module requesting a package no
             enabled repo provides, and the build fails on the next run.

          Then re-run the §8 criteria by hand, and let the monthly CI run confirm
          it. A dropped package name that nothing notices is the failure mode
          this whole migration is trying to avoid.
          EOF

          gh issue create \
            --title 'DMS has landed in Fedora: drop the COPR and rename dms' \
            --body-file /tmp/issue.md

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Fedora landing monitor'
            echo
            echo '| Package | Still in the COPR? |'
            echo '|---|---|'
            echo "| \`dms\` — COPR | ${{ steps.probe.outputs.copr_dms || 'gone from the COPR' }} |"
            echo "| \`dms\` — Fedora | ${{ steps.probe.outputs.fedora_dms || 'not in Fedora' }} |"
            echo "| \`dms-greeter\` — COPR | ${{ steps.probe.outputs.copr_dms_greeter || 'gone from the COPR' }} |"
            echo "| shell in Fedora (either name) | ${{ steps.probe.outputs.fedora_shell_name || 'neither name resolves' }} |"
            echo ""
            echo "Landed = **both** COPR names gone from the COPR **and** the shell"
            echo "resolvable from official Fedora. \`DankMaterialShell\` is already in"
            echo "Fedora, so its presence alone is not the signal."
            echo
            echo 'Landed means **both** COPR names are gone from the COPR.'
            echo '`DankMaterialShell` and `danksearch` are already in Fedora, so'
            echo 'their presence says nothing about this.'
          } >> "$GITHUB_STEP_SUMMARY"
