# Kernel and scheduler settings for gaming, taken from Bazzite's
# system_files/desktop/shared/usr/lib/sysctl.d/{70-gaming,60-kernel}.conf.
#
# Both keys were verified to exist on this kernel (7.2.4-ogc3.1.fc44) before
# being written here — an unknown key is silently ignored by systemd-sysctl, so
# a typo would have looked exactly like a setting that did nothing.
#
# vm.max_map_count — the default 65530 is far too low for titles that map a lot
# of memory; they fail to start rather than degrading. 2147483642 is what Bazzite
# ships and what the kernel accepts as an upper bound.
#
# split_lock_mitigate=0 — disables the mitigation that penalises split RPS locks
# on some CPUs. It trades a security mitigation for throughput, which is the
# trade Bazzite makes deliberately for a gaming image; that is a policy choice
# and it is recorded here rather than applied silently.

vm.max_map_count=2147483642
kernel.split_lock_mitigate=0