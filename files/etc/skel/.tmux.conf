# Dracula, from the official repository. The theme itself is a TPM plugin that
# lives in .config/tmux/ and sources scripts/dracula.sh, which sources
# scripts/utils.sh — hence three vendored files rather than a single .conf.
#
# VENDORED rather than installed with TPM: this is a system image, and a plugin
# directory in /etc/skel would be the same for every user with no way to update
# it without a `bootc switch`.
source-file -q ~/.config/tmux/dracula.tmux
