# memlock limit for Wine/Proton, from Bazzite's
# system_files/desktop/shared/etc/security/limits.d/memlock.conf.
#
# DXVK and Wine mmap large regions; a low memlock limit makes some titles fail
# to allocate rather than merely run slowly. 2147484 is the value Bazzite uses
# and is the maximum most kernels accept, so this grants all it can.

* hard memlock 2147484
* soft memlock 2147484