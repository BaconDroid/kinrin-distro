type: dnf
repos:
  nonfree: rpmfusion
  copr:
    enable:
      - avengemedia/dms
install:
  packages:
    - niri
    - dms
    - quickshell
    - gdb
    - dms-greeter
    - greetd
    - dolphin
    - konsole
    - kate
    - plasma-discover
    # Discover is inert without an engine: it pulls in only the Qt library
    # (PackageKit-Qt6), never a backend, so /usr/libexec/packagekitd is absent and
    # a search returns nothing. Verified on the built image, not assumed.
    # NOT `packagekit`: RPM names are case-sensitive, the daemon is `PackageKit`,
    # and this is the package KDE Discover actually uses -- it requires PackageKit
    # and brings it in.
    - plasma-discover-packagekit
    - plasma-workspace
    - plasma-workspace-common
    - kwin
    - libva-intel-media-driver
    - libva-utils
    - steam
    - steam-devices
    - discord
    - xwayland-satellite
    - jq
    - acl
    - curl
    - git
    - nodejs
    - python3
    - podman
    - gcc
    - make
    - cmake
    - rust
    - cargo
    - ripgrep
    - fish
    - zsh
    - npm
    - python3-pip
    - golang
    - git-lfs
    - rustfmt
    - rust-analyzer
    - golangci-lint
